<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660"><rect width="1180" height="660" fill="#ffffff"/><rect x="0" y="0" width="1180" height="84" fill="#263238"/><text x="28" y="34" text-anchor="start" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#ffffff">Step 8 of 9 - use-after-free - why it does not crash</text><text x="28" y="64" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" fill="#80cbc4">p[0] = 99;   // undefined behaviour</text><text x="1152" y="34" text-anchor="end" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#b0bec5">RSS (physical RAM held): 16 KB</text><text x="1152" y="60" text-anchor="end" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#b0bec5">entered the kernel? no</text><text x="34" y="104" text-anchor="start" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#263238">Process virtual address space</text><text x="34" y="122" text-anchor="start" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#607d8b">(the 16 KB the program asked for)</text><rect x="34" y="138" width="300" height="62" rx="6" fill="#e1bee7" stroke="#7b1fa2" stroke-width="2"/><text x="184.0" y="165.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#4a148c">page 3</text><text x="184.0" y="183.0" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="normal" fill="#4a148c">frame 0x0C11F (stale)</text><rect x="34" y="214" width="300" height="62" rx="6" fill="#e1bee7" stroke="#7b1fa2" stroke-width="2"/><text x="184.0" y="241.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#4a148c">page 2</text><text x="184.0" y="259.0" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="normal" fill="#4a148c">frame 0x3F0A7 (stale)</text><rect x="34" y="290" width="300" height="62" rx="6" fill="#e1bee7" stroke="#7b1fa2" stroke-width="2"/><text x="184.0" y="317.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#4a148c">page 1</text><text x="184.0" y="335.0" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="normal" fill="#4a148c">frame 0x0C120 (stale)</text><rect x="34" y="366" width="300" height="62" rx="6" fill="#e1bee7" stroke="#7b1fa2" stroke-width="2"/><text x="184.0" y="393.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#4a148c">page 0</text><text x="184.0" y="411.0" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="normal" fill="#4a148c">frame 0x1A2B3 (stale)</text><text x="430" y="104" text-anchor="start" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#263238">Page table (built by the kernel)</text><text x="430" y="122" text-anchor="start" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#607d8b">the MMU reads this, in hardware</text><rect x="430" y="138" width="286" height="30" fill="#37474f"/><text x="438" y="158" text-anchor="start" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">virtual page</text><text x="580" y="158" text-anchor="start" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">frame</text><text x="658" y="158" text-anchor="start" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">present</text><rect x="430" y="168" width="286" height="46" fill="#e1bee7" stroke="#b0bec5"/><te