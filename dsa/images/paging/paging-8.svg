ns Mono, Consolas, monospace" font-size="11" font-weight="normal" fill="#1b5e20">free</text><rect x="958" y="200" width="90" height="54" rx="4" fill="#cfd8dc" stroke="#78909c" stroke-width="1.5"/><text x="1003.0" y="232.0" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" font-weight="normal" fill="#455a64">other proc</text><rect x="1056" y="200" width="90" height="54" rx="4" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.5"/><text x="1101.0" y="232.0" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" font-weight="normal" fill="#1b5e20">free</text><rect x="762" y="262" width="90" height="54" rx="4" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1.5"/><text x="807.0" y="294.0" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" font-weight="normal" fill="#4a148c">was p page 2</text><rect x="860" y="262" width="90" height="54" rx="4" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.5"/><text x="905.0" y="294.0" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" font-weight="normal" fill="#1b5e20">free</text><rect x="958" y="262" width="90" height="54" rx="4" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.5"/><text x="1003.0" y="294.0" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" font-weight="normal" fill="#1b5e20">free</text><rect x="1056" y="262" width="90" height="54" rx="4" fill="#cfd8dc" stroke="#78909c" stroke-width="1.5"/><text x="1101.0" y="294.0" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" font-weight="normal" fill="#455a64">page cache</text><rect x="762" y="324" width="90" height="54" rx="4" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.5"/><text x="807.0" y="356.0" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" font-weight="normal" fill="#1b5e20">free</text><rect x="860" y="324" width="90" height="54" rx="4" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1.5"/><text x="905.0" y="356.0" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" font-weight="normal" fill="#4a148c">was p page 3</text><rect x="958" y="324" width="90" height="54" rx="4" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.5"/><text x="1003.0" y="356.0" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" font-weight="normal" fill="#1b5e20">free</text><rect x="1056" y="324" width="90" height="54" rx="4" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.5"/><text x="1101.0" y="356.0" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" font-weight="normal" fill="#1b5e20">free</text><rect x="34" y="462" width="18" height="18" rx="3" fill="#eceff1" stroke="#b0bec5"/><text x="60" y="476" text-anchor="start" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#455a64">no mapping</text><rect x="230" y="462" width="18" height="18" rx="3" fill="#ffe0b2" stroke="#ef6c00"/><text x="256" y="476" text-anchor="start" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#455a64">mapped, no RAM yet</text><rect x="426" y="462" width="18" height="18" rx="3" fill="#bbdefb" stroke="#1565c0"/><text x="452" y="476" text-anchor="start" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#455a64">RAM assigned</text><rect x="622" y="462" width="18" height="18" rx="3" fill="#e1bee7" stroke="#7b1fa2"/><text x="648" y="476" text-anchor="start" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#455a64">delete[] done, still mapped</text><rect x="818" y="462" width="18" height="18" rx="3" fill="#c8e6c9" stroke="#388e3c"/><text x="844" y="476" text-anchor="start" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#455a64">free frame</text><rect x="1014" y="462" width="18" height="18" rx="3" fill="#cfd8dc" stroke="#78909c"/><text x="1040" y="476" text-anchor="start" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#455a64">other owners</text><rect x="34" y="500" width="1112" height="142" rx="8" fill="#f5f7f8" stroke="#cfd8dc"/><text x="52" y="530" text-anchor="start" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#263238">The MMU sees a present, writable page and raises nothing. The write succeeds silently,</text><text x="52" y="556" text-anchor="start" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#263238">on memory the allocator may already have handed to someone else.</text><text x="52" y="582" text-anchor="start" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#b71c1c">No fault, no signal, no message - just wrong data somewhere else, much later.</text></svg>